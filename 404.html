<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Workout Exercise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f5;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
    }

    img {
      display: block;

      max-width: 100%;
      max-height: 70vh;

      margin: 0 auto;

      border-radius: 16px;

      opacity: 0;

      transform: scale(0.97);

      transition:
        opacity 0.4s ease,
        transform 0.5s ease;
    }

    img.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .loading {
      margin: 30px 0;
    }

    .error {
      padding: 24px;

      border: 1px solid #ddd;
      border-radius: 12px;

      background: white;

      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .back {
      margin-top: 24px;

      padding: 10px 18px;

      border: 1px solid #ccc;
      border-radius: 999px;

      background: white;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="page">

    <div id="loading" class="loading">
      Loading...
    </div>

    <div id="content" hidden>

      <h1 id="title"></h1>

      <img id="gif" alt="">

      <button
        class="back"
        onclick="history.back()"
      >
        ← Back
      </button>

    </div>

    <div id="error" class="error" hidden></div>

  </main>


  <script>

    const BASE =
      "/WorkoutExercises-";

    const loading =
      document.getElementById("loading");

    const content =
      document.getElementById("content");

    const errorBox =
      document.getElementById("error");

    const title =
      document.getElementById("title");

    const gif =
      document.getElementById("gif");


    function showError(message) {

      loading.hidden = true;

      content.hidden = true;

      errorBox.hidden = false;

      errorBox.textContent =
        message;
    }


    function getSlug() {

      const path =
        window.location.pathname;

      const match =
        path.match(/\/g\/([^/]+)/);

      if (!match) {
        return null;
      }

      return decodeURIComponent(
        match[1]
      ).toLowerCase();
    }


    async function loadExercise() {

      const slug =
        getSlug();

      if (!slug) {

        showError(
          "ERROR 1\n\n" +
          "Could not extract exercise slug.\n\n" +
          "Current URL:\n" +
          window.location.href
        );

        return;
      }


      const jsonURL =
        `${BASE}/movements.json`;


      let movements;


      try {

        const response =
          await fetch(
            jsonURL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }


        movements =
          await response.json();

      } catch (error) {

        showError(
          "ERROR 2\n\n" +
          "Could not load movements.json.\n\n" +
          `URL:\n${jsonURL}\n\n` +
          `Error:\n${error.message}`
        );

        return;
      }


      const movement =
        movements[slug];


      if (!movement) {

        showError(
          "ERROR 3\n\n" +
          "Exercise does not exist in movements.json.\n\n" +
          `Slug:\n${slug}\n\n` +
          "Available keys:\n" +
          Object.keys(movements).join("\n")
        );

        return;
      }


      if (!movement.file) {

        showError(
          "ERROR 4\n\n" +
          "Exercise exists, but has no GIF filename.\n\n" +
          JSON.stringify(
            movement,
            null,
            2
          )
        );

        return;
      }


      const gifURL =
        `${BASE}/gifs/${encodeURIComponent(
          movement.file
        )}`;


      title.textContent =
        movement.title || slug;


      document.title =
        movement.title || slug;


      gif.alt =
        movement.title || slug;


      gif.onload = () => {

        loading.hidden = true;

        content.hidden = false;

        gif.classList.add(
          "loaded"
        );
      };


      gif.onerror = () => {

        showError(
          "ERROR 5\n\n" +
          "The exercise exists, but the GIF could not be loaded.\n\n" +
          `Exercise:\n${movement.title}\n\n` +
          `GIF filename:\n${movement.file}\n\n` +
          `GIF URL:\n${gifURL}`
        );
      };


      gif.src =
        gifURL;

    }


    loadExercise();

  </script>

</body>
</html>
