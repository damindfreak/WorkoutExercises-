<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Workout Exercise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f5;
      color: #111;

      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 900px;

      display: flex;
      flex-direction: column;
      align-items: center;

      opacity: 0;
      transform: translateY(10px) scale(0.985);

      animation: pageIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .title {
      margin: 0 0 24px;

      font-size: clamp(24px, 5vw, 38px);
      font-weight: 650;
      line-height: 1.15;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .viewer {
      width: 100%;
      max-width: 760px;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 240px;
    }

    .gif {
      display: block;

      width: auto;
      max-width: 100%;
      max-height: 70vh;

      object-fit: contain;

      border-radius: 16px;

      opacity: 0;
      transform: scale(0.97);

      transition:
        opacity 0.45s ease,
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gif.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .loading {
      position: absolute;

      width: 24px;
      height: 24px;

      border: 2px solid #d0d0d0;
      border-top-color: #111;
      border-radius: 50%;

      animation: spin 0.75s linear infinite;
    }

    .loading.hidden {
      display: none;
    }

    .back-button {
      margin-top: 28px;

      padding: 10px 18px;

      border: 1px solid #d5d5d5;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .back-button:hover {
      background: #ededed;
      transform: translateY(-1px);
    }

    .error {
      width: 100%;
      max-width: 520px;

      text-align: center;
    }

    .error-code {
      margin: 0 0 10px;

      font-size: 64px;
      font-weight: 700;
      line-height: 1;
    }

    .error-title {
      margin: 0 0 8px;

      font-size: 24px;
      font-weight: 650;
    }

    .error-message {
      margin: 0;

      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .title {
        margin-bottom: 18px;
      }

      .viewer {
        min-height: 180px;
      }

      .gif {
        max-height: 65vh;
        border-radius: 12px;
      }

      .back-button {
        margin-top: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .gif {
        transition: none;
        transform: none;
      }

      .gif.loaded {
        transform: none;
      }

      .loading {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section id="exercise" class="hidden">
      <h1 id="title" class="title"></h1>

      <div class="viewer">
        <div id="loading" class="loading"></div>

        <img
          id="gif"
          class="gif"
          alt=""
        >
      </div>

      <button
        class="back-button"
        type="button"
        onclick="history.back()"
      >
        ← Back
      </button>
    </section>

    <section id="error" class="error hidden">
      <p class="error-code">404</p>
      <h1 class="error-title">Exercise not found</h1>
      <p class="error-message">
        The requested exercise does not exist or its GIF could not be found.
      </p>

      <button
        class="back-button"
        type="button"
        onclick="history.back()"
      >
        ← Back
      </button>
    </section>

  </main>

  <script>
    const REPO_BASE = "/WorkoutExercises-";

    const exerciseSection = document.getElementById("exercise");
    const errorSection = document.getElementById("error");
    const titleElement = document.getElementById("title");
    const gifElement = document.getElementById("gif");
    const loadingElement = document.getElementById("loading");

    function getSlug() {
      const path = window.location.pathname;

      const marker = "/g/";

      const index = path.indexOf(marker);

      if (index === -1) {
        return null;
      }

      return path
        .substring(index + marker.length)
        .split("/")[0]
        .trim()
        .toLowerCase();
    }

    function showError() {
      exerciseSection.classList.add("hidden");
      errorSection.classList.remove("hidden");
      document.title = "Exercise Not Found";
    }

    async function loadExercise() {
      const slug = getSlug();

      if (!slug) {
        showError();
        return;
      }

      try {
        const response = await fetch(
          `${REPO_BASE}/movements.json`,
          {
            cache: "no-cache"
          }
        );

        if (!response.ok) {
          throw new Error("Could not load movements.json");
        }

        const movements = await response.json();
        const movement = movements[slug];

        if (!movement) {
          showError();
          return;
        }

        titleElement.textContent = movement.title;
        document.title = movement.title;

        const gifURL =
          `${REPO_BASE}/gifs/${encodeURIComponent(movement.file)}`;

        gifElement.alt = movement.title;

        gifElement.onload = () => {
          loadingElement.classList.add("hidden");
          gifElement.classList.add("loaded");
        };

        gifElement.onerror = () => {
          showError();
        };

        /*
          Setting the image source here effectively starts the
          browser's loading process before revealing the GIF.
        */
        gifElement.src = gifURL;

        exerciseSection.classList.remove("hidden");

      } catch (error) {
        console.error(error);
        showError();
      }
    }

    loadExercise();
  </script>

</body>
</html>
