<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Workout Exercises</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f5;
      color: #111;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 30px;

      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -0.03em;
    }

    #list {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
      );

      gap: 12px;
    }

    a {
      display: block;

      padding: 16px 18px;

      border: 1px solid #ddd;
      border-radius: 12px;

      background: #fff;
      color: #111;

      text-decoration: none;
      font-size: 15px;
      font-weight: 500;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    a:hover {
      background: #ededed;
      transform: translateY(-2px);
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <main>
    <h1>Workout Exercises</h1>

    <div id="list">
      Loading...
    </div>
  </main>

<script>
  const REPO_BASE = "/WorkoutExercises-";
  const list = document.getElementById("list");

  async function loadMovements() {
    try {
      const url = `${REPO_BASE}/movements.json`;

      list.innerHTML = `<p>Loading: ${url}</p>`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status} ${response.statusText}`
        );
      }

      const text = await response.text();

      list.innerHTML = `
        <p>File loaded successfully.</p>
        <pre>${text.substring(0, 500)}</pre>
      `;

      const movements = JSON.parse(text);

      list.innerHTML = "";

      Object.entries(movements).forEach(
        ([slug, movement]) => {

          const link = document.createElement("a");

          link.href = `${REPO_BASE}/g/${slug}`;

          link.textContent = movement.title;

          list.appendChild(link);
        }
      );

    } catch (error) {
      console.error(error);

      list.innerHTML = `
        <p class="error">
          ERROR: ${error.message}
        </p>
      `;
    }
  }

  loadMovements();
</script>

</body>
</html>
